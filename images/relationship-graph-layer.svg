<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B07820"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A7AAF"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="#0F1117"/>

  <!-- Title -->
  <text x="600" y="58" text-anchor="middle" fill="#F3F4F6" font-size="30" font-weight="700">The Relationship Graph Layer</text>
  <text x="600" y="90" text-anchor="middle" fill="#9CA3AF" font-size="16">Four live graphs map your business, your code, your files, and your projects. Dispatch reads all of them.</text>

  <!-- Center hub -->
  <circle cx="600" cy="400" r="86" fill="#161A22" stroke="#F0A030" stroke-width="1.5"/>
  <text x="600" y="392" text-anchor="middle" fill="#F0A030" font-size="17" font-weight="700">RELATIONSHIP</text>
  <text x="600" y="414" text-anchor="middle" fill="#F0A030" font-size="17" font-weight="700">GRAPHS</text>

  <!-- Spokes -->
  <line x1="330" y1="255" x2="528" y2="357" stroke="#2A2F3A" stroke-width="2"/>
  <line x1="870" y1="255" x2="672" y2="357" stroke="#2A2F3A" stroke-width="2"/>
  <line x1="330" y1="545" x2="528" y2="443" stroke="#2A2F3A" stroke-width="2"/>
  <line x1="870" y1="545" x2="672" y2="443" stroke="#2A2F3A" stroke-width="2"/>

  <!-- Ontology card (top-left, gold: the new one) -->
  <g>
    <rect x="70" y="150" width="380" height="150" rx="16" fill="#161A22" stroke="#F0A030" stroke-width="1.5"/>
    <text x="94" y="186" fill="#F0A030" font-size="20" font-weight="700">Ontology</text>
    <text x="94" y="208" fill="#9CA3AF" font-size="13.5" font-style="italic">the who: your business as entities</text>
    <text x="94" y="234" fill="#D1D5DB" font-size="13.5">Contacts, members, payments, projects resolved</text>
    <text x="94" y="254" fill="#D1D5DB" font-size="13.5">across every data store: one identity, per-field</text>
    <text x="94" y="274" fill="#D1D5DB" font-size="13.5">provenance, and gated, audited writes.</text>
    <rect x="330" y="166" width="98" height="24" rx="12" fill="rgba(240,160,48,0.12)"/>
    <text x="379" y="183" text-anchor="middle" fill="#F5B84A" font-size="12" font-weight="600">NEW IN CORE</text>
  </g>

  <!-- GitNexus card (top-right) -->
  <g>
    <rect x="750" y="150" width="380" height="150" rx="16" fill="#161A22" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="774" y="186" fill="#4A7AAF" font-size="20" font-weight="700">GitNexus</text>
    <text x="774" y="208" fill="#9CA3AF" font-size="13.5" font-style="italic">the code: symbols and call graphs</text>
    <text x="774" y="234" fill="#D1D5DB" font-size="13.5">Every function, class, and call path indexed.</text>
    <text x="774" y="254" fill="#D1D5DB" font-size="13.5">Agents check the blast radius of a change</text>
    <text x="774" y="274" fill="#D1D5DB" font-size="13.5">before they edit, not after it breaks.</text>
  </g>

  <!-- Graphify card (bottom-left) -->
  <g>
    <rect x="70" y="500" width="380" height="150" rx="16" fill="#161A22" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="94" y="536" fill="#4A7AAF" font-size="20" font-weight="700">Graphify</text>
    <text x="94" y="558" fill="#9CA3AF" font-size="13.5" font-style="italic">the files: live system topology</text>
    <text x="94" y="584" fill="#D1D5DB" font-size="13.5">A continuously watched map of files, routes,</text>
    <text x="94" y="604" fill="#D1D5DB" font-size="13.5">and how the pieces of the system connect,</text>
    <text x="94" y="624" fill="#D1D5DB" font-size="13.5">refreshed as the workspace changes.</text>
  </g>

  <!-- Understand Anything card (bottom-right) -->
  <g>
    <rect x="750" y="500" width="380" height="150" rx="16" fill="#161A22" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="774" y="536" fill="#4A7AAF" font-size="20" font-weight="700">Understand Anything</text>
    <text x="774" y="558" fill="#9CA3AF" font-size="13.5" font-style="italic">the projects: comprehension graphs</text>
    <text x="774" y="584" fill="#D1D5DB" font-size="13.5">A curated architecture graph per project,</text>
    <text x="774" y="604" fill="#D1D5DB" font-size="13.5">auto-refreshed nightly, so any agent can</text>
    <text x="774" y="624" fill="#D1D5DB" font-size="13.5">onboard to any repo in seconds.</text>
  </g>

  <!-- Arrow down to Dispatch -->
  <line x1="600" y1="490" x2="600" y2="700" stroke="#B07820" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="622" y="672" fill="#9CA3AF" font-size="13">typed evidence</text>

  <!-- Dispatch bar -->
  <rect x="330" y="706" width="540" height="76" rx="16" fill="#161A22" stroke="#F0A030" stroke-width="1.5"/>
  <text x="600" y="738" text-anchor="middle" fill="#F3F4F6" font-size="19" font-weight="700">DISPATCH</text>
  <text x="600" y="762" text-anchor="middle" fill="#9CA3AF" font-size="13.5">routes every request using what the graphs already know</text>

  <!-- Graphiti roadmap chip -->
  <g>
    <rect x="920" y="716" width="220" height="56" rx="12" fill="rgba(74,122,175,0.10)" stroke="rgba(74,122,175,0.45)" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="1030" y="740" text-anchor="middle" fill="#4A7AAF" font-size="14" font-weight="600">Graphiti: temporal memory</text>
    <text x="1030" y="759" text-anchor="middle" fill="#9CA3AF" font-size="11.5">proving out on MyOS, coming to core</text>
  </g>

  <text x="600" y="830" text-anchor="middle" fill="#6B7280" font-size="12.5">All four ship installed and connected in the All Sorted Core. The system knows itself before you ask it anything.</text>
</svg>
